[tool.poetry]
name = "telegram-shikimori-bot"
version = "0.1.0"
description = "Anime Telegram bot"
authors = ["Snayt1k3 <snayt1k3twitch@gmail.com>"]
readme = "README.md"
packages = [{ include = "telegram_shikimori_bot" }]

[tool.poetry.dependencies]
python = "^3.11"
anilibria-py = "1.0.4"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
aiogram = "^3.6.0"
black = "^24.4.2"
alembic = "^1.13.1"
greenlet = "^3.0.3"
python-dotenv = "^1.0.1"
redis = "^5.0.4"
shiki-py = "1.1.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
