version: "3.7"

services:

  auth-db:
    image: postgres:15
    env_file:
      - auth_service/.env
    ports:
      - "5432:5432"
    volumes:
      - ./db_data/auth_db/:/var/lib/postgresql/data

  anime-db:
    image: postgres:15
    env_file:
      - anime-service/.env
    ports:
      - "5433:5432"
    volumes:
      - ./db_data/anime_db/:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - ./misc/redis_data/:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    env_file:
      - misc/.env


volumes:
  auth_db:
  redis_data: