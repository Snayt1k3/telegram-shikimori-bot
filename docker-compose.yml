version: "3.7"

services:
  bot:
    container_name: Telegram-Bot
    env_file:
      - misc/.env
    build:
      dockerfile: Dockerfile
      context: .
    working_dir: /app
    depends_on:
      - db
      - redis
    command: make start

  db:
    image: postgres:15
    container_name: postgres_container
    env_file:
      - misc/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    env_file:
      - misc/.env


volumes:
  postgres_data:
  redis_data: