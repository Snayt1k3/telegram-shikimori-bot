  redis:
    image: redis:latest
    container_name: $REDIS_HOST
    restart: always
    networks:
      - app_network
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=$REDIS_PASS
    command: [ "redis-server", "--requirepass", "$REDIS_PASS" ]
    volumes:
      - ./db_data/redis_data:/data


networks:
  app_network:
    driver: bridge
