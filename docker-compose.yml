services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8001:8001"
    depends_on:
      - auth-service
    volumes:
      - ./api-gateway/logs:/app/logs
    env_file:
      - .env
    networks:
      - app_network

  telegram-bot:
    build:
      context: ./telegram-bot
    container_name: telegram-bot
    env_file:
      - .env
    networks:
      - app_network
    volumes:
      - ./telegram-bot/logs:/app/logs

